name: Refresh from upstream

# Rebuilds the kit whenever microsoft/agent365-skills moves, bumps the patch version,
# and cuts a release, so every published kit has its own version and tag.
#
# Every fix-up is asserted against upstream's exact wording, so an upstream rewording
# fails this job and opens an issue instead of shipping a mangled kit.
#
# Runs on Windows because the build script is PowerShell with Windows path joins.

on:
  schedule:
    - cron: "17 5 * * *"          # Off the hour, when scheduled runs are less likely to be delayed.
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch or tag to build (default: main)"
        default: "main"
        required: false
      force:
        description: "Build even if upstream has not moved"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-upstream
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    env:
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare upstream HEAD with the bundled commit
        id: probe
        shell: pwsh
        run: |
          $bundled = (Get-Content kit/.a365-kit/KIT-VERSION.json -Raw | ConvertFrom-Json).upstreamCommit
          $lines = @(git ls-remote https://github.com/microsoft/agent365-skills.git "refs/heads/$env:UPSTREAM_REF" "refs/tags/$env:UPSTREAM_REF" "refs/tags/$env:UPSTREAM_REF^{}")
          if (-not $lines) { throw "microsoft/agent365-skills has no branch or tag named $env:UPSTREAM_REF" }
          # An annotated tag names its commit only on the peeled ^{} line, which must be asked for.
          $full = (@($lines | Where-Object { $_ -like '*^{}' }) + $lines)[0].Split("`t")[0]
          $short = $full.Substring(0, 7)
          "bundled=$bundled"  >> $env:GITHUB_OUTPUT
          "remote=$short"     >> $env:GITHUB_OUTPUT
          "commit=$full"      >> $env:GITHUB_OUTPUT
          $changed = ($short -ne $bundled) -or ('${{ github.event.inputs.force }}' -eq 'true')
          "changed=$($changed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "bundled upstream: $bundled   remote $env:UPSTREAM_REF: $short   changed: $changed"

      - name: Nothing to do
        if: steps.probe.outputs.changed == 'false'
        run: echo "Upstream ${{ env.UPSTREAM_REF }} is still at ${{ steps.probe.outputs.bundled }}. Kit is current."

      - name: Build the kit
        if: steps.probe.outputs.changed == 'true'
        id: build
        shell: pwsh
        run: |
          $parts = (Get-Content build/kit.version -Raw).Trim().Split('.')
          $next = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
          [IO.File]::WriteAllText("$PWD/build/kit.version", "$next`n")
          ./build/Build-Kit.ps1 -UpstreamRef '${{ steps.probe.outputs.commit }}' -Zip
          $m = Get-Content kit/.a365-kit/KIT-VERSION.json -Raw | ConvertFrom-Json
          "kit=$($m.kitVersion)"           >> $env:GITHUB_OUTPUT
          "upstream=$($m.upstreamVersion)" >> $env:GITHUB_OUTPUT
          "commit=$($m.upstreamCommit)"    >> $env:GITHUB_OUTPUT

      - name: Verify the rebuilt kit
        if: steps.probe.outputs.changed == 'true'
        uses: ./.github/actions/verify-kit

      - name: Commit the rebuilt kit
        if: steps.probe.outputs.changed == 'true'
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/kit.version kit BUNDLE-MANIFEST.json SHA256SUMS.txt
          git commit -m "Kit v${{ steps.build.outputs.kit }}: refresh from upstream agent365-skills v${{ steps.build.outputs.upstream }} (${{ steps.build.outputs.commit }})"
          git tag "v${{ steps.build.outputs.kit }}"
          git push origin HEAD "v${{ steps.build.outputs.kit }}"

      - name: Release
        if: steps.probe.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.build.outputs.kit }}"
          $zip = "agent365-onboarding-kit-v${{ steps.build.outputs.kit }}.zip"
          $bundle = "agent365-onboarding-bundle-v${{ steps.build.outputs.kit }}.zip"
          Copy-Item $zip agent365-onboarding-kit-latest.zip
          gh release create $tag $zip agent365-onboarding-kit-latest.zip $bundle --latest `
            --title "v${{ steps.build.outputs.kit }}" `
            --notes "Rebuilt from microsoft/agent365-skills ``${{ env.UPSTREAM_REF }}`` at ``${{ steps.build.outputs.commit }}``.`n`nExtract into your agent project root, or run ``agent365-kit.ps1 -Update`` / ``agent365-kit.sh --update`` in a project that already has the kit."

      - name: Open or update an issue on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "Upstream refresh failed for ${{ env.UPSTREAM_REF }} @ ${{ steps.probe.outputs.remote }}"
          $body  = "The scheduled rebuild against microsoft/agent365-skills ``${{ env.UPSTREAM_REF }}`` (``${{ steps.probe.outputs.remote }}``) failed.`n`nMost likely an upstream rewording broke one of the asserted fix-ups in ``build/upstream-fixups.json``; the log names the file and the fix-up id. Update the fix-up (or delete it if upstream fixed the underlying bug) and re-run.`n`nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $open = gh issue list --label upstream-refresh --state open --json number --jq '.[0].number'
          if ($open) { gh issue comment $open --body $body }
          else {
            gh label create upstream-refresh --color D93F0B --description "Scheduled upstream rebuild failed" 2>$null
            gh issue create --title $title --body $body --label upstream-refresh
          }
