name: Build

# Rebuilds the kit from the upstream commit it records and requires the committed kit/,
# BUNDLE-MANIFEST.json and SHA256SUMS.txt to match byte for byte. Upstream drift is left
# to the nightly refresh.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild against the pinned upstream commit
        shell: pwsh
        run: |
          $raw = Get-Content kit/.a365-kit/KIT-VERSION.json -Raw
          $commit = ([regex]'"upstreamCommit":\s*"([0-9a-f]{7,40})"').Match($raw).Groups[1].Value
          $built  = ([regex]'"builtUtc":\s*"([^"]+)"').Match($raw).Groups[1].Value
          if (-not $commit -or -not $built) { throw 'kit/.a365-kit/KIT-VERSION.json lacks upstreamCommit or builtUtc' }
          ./build/Build-Kit.ps1 -UpstreamRef $commit -BuiltUtc $built -Zip

      - name: Committed output matches the rebuild
        shell: pwsh
        run: |
          $changes = git status --porcelain -- kit BUNDLE-MANIFEST.json SHA256SUMS.txt
          if ($changes) {
            $changes
            git diff --stat -- kit BUNDLE-MANIFEST.json SHA256SUMS.txt
            throw 'Committed output differs from a rebuild. Rebuild with the upstreamCommit and builtUtc from kit/.a365-kit/KIT-VERSION.json and commit kit/, BUNDLE-MANIFEST.json and SHA256SUMS.txt.'
          }
          "kit/, BUNDLE-MANIFEST.json and SHA256SUMS.txt match the rebuild"

      - name: Version agrees everywhere
        shell: pwsh
        run: |
          $kit = (Get-Content build/kit.version -Raw).Trim()
          $installed = (Get-Content kit/.a365-kit/KIT-VERSION.json -Raw | ConvertFrom-Json).kitVersion
          $bundle = Get-Content BUNDLE-MANIFEST.json -Raw | ConvertFrom-Json
          if ($installed -ne $kit -or $bundle.kitVersion -ne $kit -or $bundle.bundleVersion -ne $kit) {
            throw "build/kit.version ($kit), KIT-VERSION.json ($installed) and BUNDLE-MANIFEST.json ($($bundle.kitVersion)) disagree"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$kit") { throw "tag $env:GITHUB_REF_NAME does not match kit version $kit" }
          "kit version $kit"

      - uses: ./.github/actions/verify-kit

  # A tag points at a commit main has already tested, so a release reruns only the build job.
  examples:
    name: example ${{ matrix.example }}
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        example: [dotnet-tool-agent, dotnet-agent365-lab, nodejs-tool-agent, python-teammate, java-tool-agent, go-tool-agent, rust-tool-agent]
    defaults:
      run:
        shell: pwsh
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(matrix.example, 'dotnet')
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: examples/${{ matrix.example }}/packages.lock.json
      - if: matrix.example == 'nodejs-tool-agent'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/nodejs-tool-agent/package-lock.json
      - if: matrix.example == 'python-teammate'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/python-teammate/requirements-lock.txt
      - if: matrix.example == 'java-tool-agent'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: examples/java-tool-agent/pom.xml
      - if: matrix.example == 'go-tool-agent'
        uses: actions/setup-go@v5
        with:
          go-version-file: examples/go-tool-agent/go.mod
          cache: false
      - if: matrix.example == 'rust-tool-agent'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('examples/rust-tool-agent/Cargo.lock') }}

      - name: Offline build and tests, as the example's README documents them
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          switch ('${{ matrix.example }}') {
            'dotnet-tool-agent'   { dotnet restore --locked-mode; dotnet run -- --self-test; dotnet run -- --mock "Hello Agent 365" }
            'dotnet-agent365-lab' { dotnet restore --locked-mode; dotnet run -- --self-test; dotnet run -- --mock "Hello Agent 365"; ./Test-Agent365TokenPlan.ps1 }
            'nodejs-tool-agent'   { npm ci --no-audit --no-fund; npm test; npm start }
            'python-teammate'     { python -m pip install --disable-pip-version-check --target deps -r requirements-lock.txt; python -I -S run_offline.py; python demo.py "Hello Agent 365" }
            'java-tool-agent'     { mvn -B -q test; mvn -B -q exec:java "-Dexec.args=--mock Hello Agent 365" }
            'go-tool-agent'       { go test ./...; go run . --mock "Hello Agent 365" }
            'rust-tool-agent'     { cargo test --locked; cargo run --locked -- --mock "Hello Agent 365" }
          }
